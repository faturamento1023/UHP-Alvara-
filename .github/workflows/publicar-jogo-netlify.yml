name: Publicar jogo otimizado para Netlify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-jogo-netlify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Baixar repositorio de destino
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar codigo do jogo
        run: |
          git clone --depth 1 https://github.com/LucasMarquesShiva/the-free-game.git /tmp/the-free-game

      - name: Exportar Web oficial
        env:
          HOME: /root
        run: |
          cd /tmp/the-free-game
          python3 tools/dev.py --godot "$(command -v godot)" export-web
          test -f builds/web/index.html
          test -f builds/web/release.json

      - name: Empacotar para Netlify
        run: |
          cd /tmp/the-free-game
          rm -rf builds/static
          python3 tools/pack_static.py builds/web builds/static
          test -f builds/static/index.html
          test -f builds/static/download-manifest.json
          find builds/static -type f -printf '%s %p\n' | sort -nr | head -20

      - name: Substituir repositorio pelo jogo otimizado
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/the-free-game/builds/static/. .
          printf '[build]\n  publish = "."\n' > netlify.toml

      - name: Publicar arquivos finais
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publica jogo otimizado para Netlify"
          git push origin main
