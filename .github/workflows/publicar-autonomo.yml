name: Publicar vila autonoma

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-autonomo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Baixar repositorio de destino
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        run: |
          apt-get update
          apt-get install -y python3

      - name: Baixar codigo base do jogo
        run: git clone --depth 1 https://github.com/LucasMarquesShiva/the-free-game.git /tmp/the-free-game

      - name: Aplicar autonomia
        run: |
          cp autonomous_sim.gd /tmp/the-free-game/game/simulation/autonomous_sim.gd
          python3 patch_autonomy.py

      - name: Exportar para Web
        env:
          HOME: /root
        run: |
          mkdir -p /tmp/export-web
          cd /tmp/the-free-game/game
          godot --headless --path . --export-release "Web" /tmp/export-web/index.html
          test -f /tmp/export-web/index.html
          test -f /tmp/export-web/index.pck
          test -f /tmp/export-web/index.wasm

      - name: Substituir repositorio pelo jogo autonomo
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/export-web/. .
          cp /tmp/the-free-game/LICENSE ./LICENSE
          cp /tmp/the-free-game/LICENSE-ASSETS.md ./LICENSE-ASSETS.md
          cp /tmp/the-free-game/THIRD_PARTY_NOTICES.md ./THIRD_PARTY_NOTICES.md
          printf '[build]\n  publish = "."\n' > netlify.toml

      - name: Publicar arquivos prontos
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publica The Free Game com vila autonoma"
          git push origin main
